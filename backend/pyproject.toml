[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = [
    "APP_ENV=testing",
    "SECRET_KEY=test-secret-key",
    "DATABASE_URL=postgresql+asyncpg://foodapp_user:foodapp_pass@localhost:5432/foodapp_test",
    "DATABASE_URL_SYNC=postgresql://foodapp_user:foodapp_pass@localhost:5432/foodapp_test",
    "REDIS_URL=redis://localhost:6379/1",
]
